version: 2

updates:
  - package-ecosystem: "maven"
    directory: "/apps/backend/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Moscow"

    open-pull-requests-limit: 5

    labels:
      - dependencies
      - backend

    commit-message:
      prefix: "build"

  - package-ecosystem: "npm"
    directory: "/apps/web/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Moscow"

    open-pull-requests-limit: 5

    labels:
      - dependencies
      - frontend

    commit-message:
      prefix: "build"

  - package-ecosystem: "docker"
    directory: "/apps/backend"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Moscow"

    open-pull-requests-limit: 3

    labels:
      - dependencies
      - docker

    commit-message:
      prefix: "build"