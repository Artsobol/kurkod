databaseChangeLog:
  - changeSet:
      id: 029-migrate-user-auth-schema
      author: codex
      changes:
        - sql:
            dbms: postgresql
            splitStatements: true
            stripComments: true
            sql: |
              ALTER TABLE users RENAME COLUMN password TO password_hash;
              ALTER TABLE users ADD COLUMN role varchar(50);
              ALTER TABLE users ADD COLUMN email_verified_at timestamp with time zone;

              UPDATE users u
              SET role = COALESCE(
                  (
                    SELECT r.user_system_role
                    FROM user_role ur
                    JOIN role r ON r.id = ur.role_id
                    WHERE ur.user_id = u.id
                    ORDER BY CASE r.user_system_role
                      WHEN 'SUPER_ADMIN' THEN 1
                      WHEN 'ADMIN' THEN 2
                      WHEN 'DIRECTOR' THEN 3
                      ELSE 4
                    END
                    LIMIT 1
                  ),
                  'USER'
              );

              UPDATE users
              SET is_active = registration_status = 'ACTIVE';

              ALTER TABLE users ALTER COLUMN role SET NOT NULL;
              ALTER TABLE users DROP COLUMN last_login;
              ALTER TABLE users DROP COLUMN registration_status;

              DROP TABLE user_role;
              DROP TABLE role;

              DROP TABLE refresh_token;
              CREATE TABLE refresh_token (
                id bigserial CONSTRAINT pk_refresh_token PRIMARY KEY,
                token_hash varchar(64) NOT NULL CONSTRAINT uq_refresh_token_hash UNIQUE,
                user_id bigint NOT NULL,
                expires_at timestamp with time zone NOT NULL,
                revoked_at timestamp with time zone,
                revoked_reason varchar(30),
                replace_by_id bigint CONSTRAINT uq_refresh_token_replace_by UNIQUE,
                session_id uuid NOT NULL,
                ip_address varchar(64) NOT NULL,
                user_agent text NOT NULL,
                device_name varchar(255),
                created_at timestamp with time zone NOT NULL,
                last_used_at timestamp with time zone NOT NULL,
                CONSTRAINT fk_refresh_token_user_id
                  FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,
                CONSTRAINT fk_refresh_token_replace_by_id
                  FOREIGN KEY (replace_by_id) REFERENCES refresh_token(id)
              );

              CREATE INDEX idx_refresh_token_user_id ON refresh_token(user_id);
              CREATE INDEX idx_refresh_token_session_id ON refresh_token(session_id);
              CREATE INDEX idx_refresh_token_token_hash ON refresh_token(token_hash);
