spring:
  application:
    name: kurkod-service

  profiles:
    default: dev

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: list
    display-request-duration: true

server:
  servlet:
    context-path: /api/v1

swagger:
  servers:
    first: ${SWAGGER_SERVER:${server.servlet.context-path}}

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration: ${JWT_LIFETIME:PT15M}
    refresh-token:
      ttl: ${REFRESH_TTL:PT720H}
      pepper: ${REFRESH_PEPPER}
      length: 64
    cookie:
      secure: ${COOKIE_SECURE:true}
      max-age: ${REFRESH_TTL:PT720H}
      same-site: ${COOKIE_SAME_SITE:Lax}
      cookie-name: refresh_token
      path: /api/v1/auth
    session:
      max-sessions: ${MAX_SESSIONS:5}
    security-config:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
      max-age: 3600
  i18n:
    basename: classpath:i18n/messages/messages,classpath:i18n/errors/errors,classpath:i18n/validations/validations
    encoding: UTF-8
    fallback-to-system-locale: false
    cache-seconds: 0
