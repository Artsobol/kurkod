services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kurkod_db
      POSTGRES_USER: kurkod
      POSTGRES_PASSWORD: kurkod

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/kurkod_db
      DB_USER: kurkod
      DB_PASSWORD: kurkod

      SPRING_PROFILES_ACTIVE: dev

      JWT_SECRET: ${JWT_SECRET:-ZGV2LW9ubHkta3Vya29kLWp3dC1zZWNyZXQta2V5LTMyaXRlcw==}
      JWT_LIFETIME: ${JWT_LIFETIME:-PT15M}
      REFRESH_TTL: ${REFRESH_TTL:-PT720H}
      REFRESH_PEPPER: ${REFRESH_PEPPER:-dev-only-refresh-token-pepper-change-me}
      JPA_SHOW_SQL: "false"
      LOG_LEVEL_APP: INFO
      LOG_LEVEL_WEB: INFO
      LOG_LEVEL_SQL: WARN
      LOG_LEVEL_BINDER: WARN
      LOG_LEVEL_DISPATCHER: INFO

      SWAGGER_SERVER: http://localhost:8080/api/v1
